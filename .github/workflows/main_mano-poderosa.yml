# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - mano-poderosa

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Build app
        run: npm run build

      - name: Assemble deployment package
        run: |
          mkdir -p package/backend package/frontend
          cp package.json package/package.json
          cp backend/server.js package/backend/server.js
          cp backend/package.json package/backend/package.json
          cp backend/package-lock.json package/backend/package-lock.json
          cp -r backend/node_modules package/backend/node_modules
          cp -r frontend/dist package/frontend/dist

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: package

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: release

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_14ABBEB82CF64343A8CA840A55AA5E38 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_11B6913BDCBE4EBEA905EFDBB659CDF5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_998C7571B42E451A8DDFEF86C88559AF }}

      - name: Set startup command
        run: az webapp config set --resource-group mano-poderosa_group --name mano-poderosa --startup-file "node backend/server.js"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: mano-poderosa
          slot-name: Production
          package: release
